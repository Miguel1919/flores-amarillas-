<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un universo para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="escenaTres"></div>

<div class="capa-ui">
  <div id="introOverlay">
    <h1>Un universo para ti</h1>
    <p>hay algo esperándote al otro lado, dale clic y empecemos el viaje</p>
    <button id="botonViaje">comenzar el viaje</button>
  </div>

  <div id="textoViaje">viajando a través del tiempo y el espacio</div>
  <div id="pistaGiro">arrastra para mirar alrededor y busca las flores más grandes</div>

  <div id="fondoModal">
    <div class="carta">
      <button class="cerrarCarta" id="cerrarCarta" aria-label="cerrar">&times;</button>
      <p id="textoCarta"></p>
    </div>
  </div>
</div>

<script src="script.js"></script>
<audio id="musicaFondo" src="musica.mp3" loop></audio>


</body>
</html>
